[FakeFps]
; 1 = tampilkan FPS overlay = Multiplier x FPS asli (counter BlueStacks dibaca dulu 2 detik)
; 0 = biarkan writer BlueStacks menulis angka FPS aslinya
Enabled=1

; Kelipatan angka overlay. 2 = fps asli 100 tampil 200.
; Rentang 1..10; nilai di luar itu di-clamp oleh engine.
Multiplier=2

; 1 = Nilai FPS bergerak natural (contoh: 198 - 202 di sekitar 200)
; 0 = Nilai FPS statis pas di hasil perkalian
Jitter=1
