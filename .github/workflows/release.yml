name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.1.3'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release notes
        id: meta
        shell: pwsh
        run: |
          $tag = if ('${{ inputs.tag }}') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v')
          $notes = "docs/RELEASE-NOTES-$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes. Write them before tagging."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Build, test, sign, hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ('${{ inputs.tag }}') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v')
          $params = @{ Version = $version }

          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          if (-not [string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            $params.Sign = $true
            $params.Pfx = $pfx
            if (-not [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
              $params.PfxPassword = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
            }
            Write-Host 'Certificate secret found; requesting a signed build.'
          }
          else {
            Write-Host 'No certificate secret; building an explicitly unsigned release.'
          }

          try {
            ./scripts/Build-SingleFile.ps1 @params
          }
          finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }

      - name: Verify executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem dist -Filter 'Stellary.PX-*-win-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Single-file executable not found.' }
          if ($exe.Length -lt 20MB) { throw "Executable is unexpectedly small: $($exe.Length) bytes." }
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sidecar = Get-Content -LiteralPath ($exe.FullName + '.sha256') -Raw
          if (-not $sidecar.StartsWith($hash)) { throw 'SHA-256 sidecar does not match the executable.' }
          Write-Host ("{0}  {1} bytes  {2}" -f $exe.Name, $exe.Length, $hash)

          $notes = Get-Content -LiteralPath '${{ steps.meta.outputs.notes }}' -Raw
          $body = $notes.TrimEnd() + "`n`n## SHA-256`n`n$hash  $($exe.Name)`n"
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'release-body.md'), $body)

      - name: Publish draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Stellary.PX ${{ steps.meta.outputs.version }}
          body_path: ${{ runner.temp }}/release-body.md
          draft: true
          overwrite_files: false
          files: |
            dist/Stellary.PX-${{ steps.meta.outputs.version }}-win-x64.exe
