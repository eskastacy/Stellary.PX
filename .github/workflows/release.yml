name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, test, sign, hash, archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ('${{ inputs.tag }}') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v')
          $params = @{ Version = $version }

          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          if (-not [string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            $params.Sign = $true
            $params.Pfx = $pfx
            if (-not [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
              $params.PfxPassword = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
            }
            Write-Host 'Certificate secret found; requesting a signed build.'
          }
          else {
            Write-Host 'No certificate secret; building an explicitly unsigned release.'
          }

          try {
            ./scripts/Build-Release.ps1 @params
          }
          finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }

      - name: Verify manifest
        shell: pwsh
        run: |
          $dir = Get-ChildItem dist -Directory | Select-Object -First 1
          ./scripts/Verify-Release.ps1 -Path $dir.FullName -Sums (Join-Path $dir.FullName 'SHA256SUMS.txt')

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Stellary.PX ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Windows x64, framework-dependent. Install the .NET 8 Desktop Runtime.

            Verify `SHA256SUMS.txt` before running. The Authenticode status is
            reported in the build log; an unsigned build is never labeled signed.

            Full documentation and release notes are inside the archive.
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*/SHA256SUMS.txt
